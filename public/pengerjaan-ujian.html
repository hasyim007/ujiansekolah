<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengerjaan Ujian — Sistem Ujian Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Plus Jakarta Sans','ui-sans-serif','system-ui'] },
    colors: { accent: { 300:'#5fe0c5', 500:'#0ea5a4', 600:'#0c8584' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api.js"></script>
<script src="//unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .glass{ background:rgba(255,255,255,.7); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.5); }
  .fade{ transition: opacity 140ms ease-out; }
</style>
</head>
<body class="min-h-screen bg-slate-50" x-data="ujian()" x-init="init()" @beforeunload.window="beforeUnload($event)">

  <template x-if="loading">
    <div class="min-h-screen flex items-center justify-center"><i data-lucide="loader-2" class="w-6 h-6 text-accent-600 animate-spin"></i></div>
  </template>

  <template x-if="!loading && !siap">
    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-8 text-center space-y-3 max-w-sm">
        <i data-lucide="alert-circle" class="w-8 h-8 text-amber-500 mx-auto"></i>
        <p class="text-slate-700" x-text="pesanError || 'Sesi ujian tidak ditemukan atau sudah selesai.'"></p>
        <a href="login-peserta.html" class="inline-block h-11 px-5 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-semibold leading-[44px]">Kembali ke Login</a>
      </div>
    </div>
  </template>

  <template x-if="!loading && siap">
  <div>
  <header class="sticky top-0 z-30 glass shadow-lg shadow-slate-900/5">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-accent-500 flex items-center justify-center shrink-0"><i data-lucide="graduation-cap" class="w-4 h-4 text-white"></i></div>
        <span class="font-semibold text-slate-800 truncate hidden sm:inline" x-text="sesi.nama"></span>
      </div>
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full" :class="statusBadgeClass">
          <i :data-lucide="statusIcon" class="w-3.5 h-3.5" :class="{'animate-spin': autosaveStatus==='saving'}"></i><span x-text="statusLabel"></span>
        </div>
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-lg tabular-nums" :class="sisaDetik <= 300 ? 'bg-red-50 text-red-600' : 'bg-accent-500/10 text-accent-700'">
          <i data-lucide="timer" class="w-5 h-5"></i><span x-text="formatWaktu(sisaDetik)"></span>
        </div>
        <button @click="modalSelesai = true" class="h-9 px-3 sm:px-4 rounded-xl bg-accent-500 hover:bg-accent-600 text-white text-sm font-semibold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-600">Selesai</button>
        <button @click="modalKendala = true" aria-label="Lapor Kendala" class="w-9 h-9 rounded-xl border border-slate-200 bg-white/70 hover:bg-white flex items-center justify-center transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500"><i data-lucide="life-buoy" class="w-4 h-4 text-slate-600"></i></button>
      </div>
    </div>
    <div class="sm:hidden px-4 pb-2 flex justify-center">
      <div class="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full" :class="statusBadgeClass">
        <i :data-lucide="statusIcon" class="w-3.5 h-3.5" :class="{'animate-spin': autosaveStatus==='saving'}"></i><span x-text="statusLabel"></span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 md:py-8 space-y-4 pb-28 lg:pb-8">
    <div class="lg:grid lg:grid-cols-[1fr_260px] lg:gap-6 lg:items-start">

      <section class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-5 sm:p-7 space-y-6 fade" :key="soalAktifIdx">
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-accent-600">Soal <span x-text="soalAktifIdx+1"></span> dari <span x-text="soal.length"></span></span>
          <button @click="toggleRagu()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full border transition"
            :class="statusSoal[soalAktif.id]==='ragu' ? 'bg-amber-100 border-amber-300 text-amber-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'">
            <i data-lucide="flag" class="w-3.5 h-3.5"></i> Ragu-ragu
          </button>
        </div>

        <p class="text-base sm:text-lg leading-relaxed text-slate-800 font-medium" x-text="soalAktif.teks"></p>

        <div class="space-y-3">
          <template x-for="(opsi, oIdx) in soalAktif.pilihan" :key="oIdx">
            <label class="flex items-start gap-3 rounded-xl border p-4 cursor-pointer transition select-none"
              :class="jawaban[soalAktif.id] === oIdx ? 'border-accent-500 bg-accent-500/5 ring-1 ring-accent-500' : 'border-slate-200 bg-white/60 hover:bg-white'">
              <input type="radio" :name="'soal'+soalAktifIdx" class="mt-1 w-5 h-5 text-accent-500 focus-visible:ring-2 focus-visible:ring-accent-500"
                :checked="jawaban[soalAktif.id] === oIdx" @change="pilihJawaban(oIdx)">
              <span class="text-base text-slate-700 leading-relaxed"><span class="font-semibold mr-1" x-text="String.fromCharCode(65+oIdx)+'.'"></span><span x-text="opsi"></span></span>
            </label>
          </template>
        </div>

        <div class="flex items-center justify-between pt-2">
          <button @click="prev()" :disabled="soalAktifIdx===0" class="h-11 px-4 rounded-xl border border-slate-200 bg-white/70 text-slate-600 font-medium disabled:opacity-40 hover:bg-white transition flex items-center gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500"><i data-lucide="arrow-left" class="w-4 h-4"></i> Sebelumnya</button>
          <button @click="next()" :disabled="soalAktifIdx===soal.length-1" class="h-11 px-4 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-medium disabled:opacity-40 transition flex items-center gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-600">Berikutnya <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
        </div>
      </section>

      <aside class="hidden lg:block glass rounded-2xl shadow-lg shadow-slate-900/5 p-5 sticky top-24">
        <p class="text-sm font-semibold text-slate-700 mb-3">Navigasi Soal</p>
        <div class="grid grid-cols-5 gap-2">
          <template x-for="(s, idx) in soal" :key="s.id">
            <button @click="gotoSoal(idx)" class="h-10 rounded-lg text-sm font-semibold transition" :class="navBtnClass(idx)" x-text="idx+1"></button>
          </template>
        </div>
        <div class="mt-4 space-y-2 text-xs text-slate-600">
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-slate-300"></span> Belum dijawab</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-accent-500"></span> Sudah dijawab</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-amber-400"></span> Ragu-ragu</div>
        </div>
      </aside>
    </div>
  </main>

  <div class="lg:hidden fixed bottom-0 inset-x-0 z-20">
    <button @click="drawerOpen = !drawerOpen" class="w-full glass border-t border-white/60 py-2.5 flex items-center justify-center gap-2 text-sm font-semibold text-slate-700">
      <i data-lucide="grid-3x3" class="w-4 h-4"></i> Navigasi Soal <i :data-lucide="drawerOpen ? 'chevron-down' : 'chevron-up'" class="w-4 h-4"></i>
    </button>
    <div x-show="drawerOpen" x-transition class="glass border-t border-white/60 p-4 max-h-64 overflow-y-auto">
      <div class="grid grid-cols-6 gap-2">
        <template x-for="(s, idx) in soal" :key="s.id">
          <button @click="gotoSoal(idx); drawerOpen=false" class="h-10 rounded-lg text-sm font-semibold transition" :class="navBtnClass(idx)" x-text="idx+1"></button>
        </template>
      </div>
    </div>
  </div>

  <div x-show="modalSelesai" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40" @keydown.escape.window="modalSelesai=false" style="display:none">
    <div class="glass rounded-2xl shadow-lg shadow-slate-900/10 max-w-sm w-full p-6 space-y-4" @click.outside="modalSelesai=false">
      <div class="flex items-center gap-2"><i data-lucide="clipboard-check" class="w-5 h-5 text-accent-600"></i><h3 class="text-lg font-bold text-slate-900">Selesaikan Ujian?</h3></div>
      <p class="text-sm text-slate-600">Periksa ringkasan pengerjaanmu sebelum submit final.</p>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="rounded-xl bg-white/70 border border-slate-200 p-3"><p class="text-xl font-bold text-slate-800" x-text="soal.length"></p><p class="text-xs text-slate-500">Total</p></div>
        <div class="rounded-xl bg-accent-500/10 border border-accent-500/30 p-3"><p class="text-xl font-bold text-accent-700" x-text="jumlahDijawab()"></p><p class="text-xs text-accent-700">Dijawab</p></div>
        <div class="rounded-xl bg-amber-50 border border-amber-200 p-3"><p class="text-xl font-bold text-amber-700" x-text="jumlahRagu()"></p><p class="text-xs text-amber-700">Ragu-ragu</p></div>
      </div>
      <template x-if="soal.length - jumlahDijawab() > 0"><p class="text-xs text-amber-600 text-center">Masih ada <span x-text="soal.length - jumlahDijawab()"></span> soal yang belum dijawab.</p></template>
      <div class="flex gap-3 pt-1">
        <button @click="modalSelesai=false" class="flex-1 h-11 rounded-xl border border-slate-200 bg-white/70 text-slate-600 font-medium hover:bg-white transition">Kembali</button>
        <button @click="submitUjian()" :disabled="submitting" class="flex-1 h-11 rounded-xl bg-accent-500 hover:bg-accent-600 disabled:bg-slate-300 text-white font-semibold transition">Ya, Submit</button>
      </div>
    </div>
  </div>

  <div x-show="modalKendala" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40" @keydown.escape.window="modalKendala=false" style="display:none">
    <div class="glass rounded-2xl shadow-lg shadow-slate-900/10 max-w-sm w-full p-6 space-y-4" @click.outside="modalKendala=false">
      <div class="flex items-center gap-2"><i data-lucide="life-buoy" class="w-5 h-5 text-accent-600"></i><h3 class="text-lg font-bold text-slate-900">Lapor Kendala</h3></div>
      <p class="text-sm text-slate-600">Ceritakan kendalamu, nanti pengawas akan segera dibantu.</p>
      <textarea x-model="kendalaTeks" rows="3" placeholder="Contoh: layar tiba-tiba blank, koneksi lambat, dll" class="w-full rounded-xl border border-slate-200 bg-white/80 p-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500"></textarea>
      <div class="flex gap-3">
        <button @click="modalKendala=false" class="flex-1 h-11 rounded-xl border border-slate-200 bg-white/70 text-slate-600 font-medium hover:bg-white transition">Batal</button>
        <button @click="kirimKendala()" class="flex-1 h-11 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-semibold transition">Kirim</button>
      </div>
      <template x-if="kendalaTerkirim"><p class="text-xs text-accent-600 text-center">Laporan terkirim, pengawas akan segera membantu.</p></template>
    </div>
  </div>
  </div>
  </template>

<script>
function ujian(){
  return {
    loading: true,
    siap: false,
    pesanError: '',
    sesi: null, peserta: null, hasil: null,
    soal: [],
    jawaban: {},
    statusSoal: {},
    soalAktifIdx: 0,
    drawerOpen: false,
    modalSelesai: false,
    modalKendala: false,
    kendalaTeks: '',
    kendalaTerkirim: false,
    submitting: false,
    sisaDetik: 0,
    timerHandle: null,
    autosaveStatus: 'saved',
    online: navigator.onLine,
    historyGuardActive: true,

    get soalAktif(){ return this.soal[this.soalAktifIdx] || {teks:'',pilihan:[]}; },

    async init(){
      lucide.createIcons();
      const sess = DB.getSession();
      if(!sess){ this.loading = false; this.siap = false; return; }

      try{
        this.hasil = await DB.getHasilById(sess.hasilId);
        this.sesi = await DB.getSesiById(sess.sesiId);
        this.peserta = await DB.getPesertaById(sess.pesertaId);
      }catch(e){
        this.pesanError = 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.';
        this.loading = false; this.siap = false; return;
      }

      if(!this.hasil || !this.sesi || this.hasil.status === 'Selesai'){ this.loading = false; this.siap = false; return; }

      const semuaSoal = await DB.getSoal();
      this.soal = semuaSoal.filter(s => (this.sesi.soalIds||[]).includes(s.id));
      this.jawaban = { ...this.hasil.jawaban };
      this.statusSoal = { ...this.hasil.statusSoal };

      const elapsedSec = Math.floor((Date.now() - this.hasil.waktuMulai)/1000);
      this.sisaDetik = Math.max(0, this.sesi.durasi*60 - elapsedSec);

      this.loading = false;
      this.siap = true;
      this.$nextTick(()=>lucide.createIcons());

      this.timerHandle = setInterval(() => {
        if(this.sisaDetik > 0){ this.sisaDetik--; } else { clearInterval(this.timerHandle); this.autoSubmit(); }
      }, 1000);

      window.addEventListener('online', () => { this.online = true; });
      window.addEventListener('offline', () => { this.online = false; });

      history.pushState(null, '', location.href);
      window.addEventListener('popstate', () => { if(this.historyGuardActive) history.pushState(null, '', location.href); });

      this.$watch('drawerOpen', () => this.$nextTick(()=>lucide.createIcons()));
      this.$watch('modalSelesai', () => this.$nextTick(()=>lucide.createIcons()));
      this.$watch('modalKendala', () => this.$nextTick(()=>lucide.createIcons()));
    },

    formatWaktu(detik){
      const h = Math.floor(detik/3600), m = Math.floor((detik%3600)/60), s = detik%60;
      const pad = n => String(n).padStart(2,'0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    },

    get statusIcon(){ if(!this.online) return 'wifi-off'; if(this.autosaveStatus === 'saving') return 'loader-2'; if(this.autosaveStatus === 'error') return 'alert-triangle'; return 'check-circle-2'; },
    get statusLabel(){ if(!this.online) return 'Offline, jawaban akan disinkronkan'; if(this.autosaveStatus === 'saving') return 'Menyimpan...'; if(this.autosaveStatus === 'error') return 'Gagal simpan, akan dicoba lagi'; return 'Tersimpan'; },
    get statusBadgeClass(){ if(!this.online) return 'bg-amber-50 text-amber-700'; if(this.autosaveStatus === 'error') return 'bg-red-50 text-red-600'; return 'bg-accent-500/10 text-accent-700'; },

    pilihJawaban(oIdx){
      const id = this.soalAktif.id;
      this.jawaban[id] = oIdx;
      this.statusSoal[id] = 'dijawab';
      this.simpan();
    },
    toggleRagu(){
      const id = this.soalAktif.id;
      const cur = this.statusSoal[id];
      this.statusSoal[id] = cur === 'ragu' ? (this.jawaban[id] !== undefined ? 'dijawab' : undefined) : 'ragu';
      this.simpan();
    },
    gotoSoal(idx){ this.soalAktifIdx = idx; },
    next(){ if(this.soalAktifIdx < this.soal.length-1) this.soalAktifIdx++; },
    prev(){ if(this.soalAktifIdx > 0) this.soalAktifIdx--; },

    navBtnClass(idx){
      if(idx === this.soalAktifIdx) return 'bg-slate-800 text-white ring-2 ring-accent-500';
      const s = this.statusSoal[this.soal[idx].id];
      if(s === 'ragu') return 'bg-amber-400 text-white';
      if(s === 'dijawab') return 'bg-accent-500 text-white';
      return 'bg-slate-200 text-slate-600';
    },

    jumlahDijawab(){ return Object.keys(this.jawaban).length; },
    jumlahRagu(){ return Object.values(this.statusSoal).filter(s=>s==='ragu').length; },

    async simpan(){
      this.autosaveStatus = 'saving';
      const id = this.soalAktif.id;
      try{
        await DB.simpanJawaban(this.hasil.id, id, this.jawaban[id], this.statusSoal[id]);
        this.autosaveStatus = 'saved';
      }catch(e){
        this.autosaveStatus = 'error';
      }
      this.$nextTick(()=>lucide.createIcons());
    },

    kirimKendala(){
      if(!this.kendalaTeks.trim()) return;
      this.kendalaTerkirim = true;
      setTimeout(() => { this.modalKendala = false; this.kendalaTerkirim = false; this.kendalaTeks = ''; }, 1200);
    },

    async submitUjian(){
      this.submitting = true;
      this.historyGuardActive = false;
      clearInterval(this.timerHandle);
      try{
        await DB.submitHasil(this.hasil.id);
        window.location.href = 'ujian-selesai.html';
      }catch(e){
        this.submitting = false;
        this.historyGuardActive = true;
        alert('Gagal mengirim jawaban, coba lagi ya. Periksa koneksi internet kamu.');
      }
    },
    async autoSubmit(){
      this.historyGuardActive = false;
      try{ await DB.submitHasil(this.hasil.id); }catch(e){ /* tetap arahkan ke halaman selesai */ }
      window.location.href = 'ujian-selesai.html';
    },

    beforeUnload(e){
      if(!this.siap) return;
      e.preventDefault();
      e.returnValue = '';
    }
  }
}
</script>
</body>
</html>
