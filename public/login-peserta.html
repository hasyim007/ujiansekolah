<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Peserta — Sistem Ujian Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Plus Jakarta Sans','ui-sans-serif','system-ui'] },
    colors: { accent: { 300:'#5fe0c5', 500:'#0ea5a4', 600:'#0c8584' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api.js"></script>
<script src="//unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .glass{ background:rgba(255,255,255,.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.4); }
</style>
</head>
<body class="min-h-screen bg-slate-50 relative overflow-x-hidden">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 w-96 h-96 bg-accent-300/30 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-24 w-96 h-96 bg-accent-500/20 rounded-full blur-3xl"></div>
  </div>

  <div x-data="loginPeserta()" x-init="init()" class="relative min-h-screen flex flex-col items-center justify-center px-4 py-10">

    <div class="mb-6 text-center">
      <div class="mx-auto mb-3 w-14 h-14 rounded-2xl bg-accent-500 flex items-center justify-center shadow-lg shadow-accent-500/30">
        <i data-lucide="graduation-cap" class="w-7 h-7 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Sistem Ujian Sekolah</h1>
      <p class="text-slate-600 mt-1">Ayo masuk dulu sebelum mulai ujian</p>
    </div>

    <div class="flex items-center gap-2 mb-6">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition" :class="step >= 1 ? 'bg-accent-500 text-white' : 'bg-slate-200 text-slate-500'">1</div>
        <span class="text-sm font-medium" :class="step >= 1 ? 'text-slate-800' : 'text-slate-400'">Identitas</span>
      </div>
      <div class="w-8 h-0.5 rounded" :class="step >= 2 ? 'bg-accent-500' : 'bg-slate-200'"></div>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition" :class="step >= 2 ? 'bg-accent-500 text-white' : 'bg-slate-200 text-slate-500'">2</div>
        <span class="text-sm font-medium" :class="step >= 2 ? 'text-slate-800' : 'text-slate-400'">Token Sesi</span>
      </div>
    </div>

    <div class="w-full max-w-md space-y-4">

      <template x-if="errorFatal">
        <div class="rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700 flex items-start gap-2">
          <i data-lucide="wifi-off" class="w-4 h-4 mt-0.5 shrink-0"></i><span x-text="errorFatal"></span>
        </div>
      </template>

      <template x-if="step === 1">
        <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 space-y-4">
          <div>
            <h2 class="text-lg font-semibold text-slate-900">Masukkan Data Kamu</h2>
            <p class="text-sm text-slate-600">Sesuai yang tertulis di kartu ujian kamu ya.</p>
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-slate-700">Nama atau Nomor Peserta</label>
            <input type="text" x-model="form.identitas" @keydown.enter="verifikasiIdentitas()" placeholder="Contoh: 25-05A-01"
              class="w-full h-12 rounded-xl border border-slate-200 bg-white/80 px-4 text-base text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500 focus:border-accent-500 transition">
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-slate-700">Password / PIN Kartu</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" x-model="form.pin" @keydown.enter="verifikasiIdentitas()" placeholder="4-6 angka"
              class="w-full h-12 rounded-xl border border-slate-200 bg-white/80 px-4 text-base tracking-widest text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500 focus:border-accent-500 transition">
            <p class="text-xs text-slate-400">Contoh percobaan (data seed): <span class="font-mono">25-05A-01</span> / PIN <span class="font-mono">1234</span></p>
          </div>

          <template x-if="errorIdentitas">
            <div class="flex items-start gap-2 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700">
              <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i><span x-text="errorIdentitas"></span>
            </div>
          </template>
          <template x-if="percobaanIdentitas > 0 && percobaanIdentitas < batasIdentitas">
            <p class="text-xs text-amber-600 text-center">Percobaan ke-<span x-text="percobaanIdentitas"></span> dari <span x-text="batasIdentitas"></span></p>
          </template>

          <button @click="verifikasiIdentitas()" :disabled="loadingIdentitas || terkunciIdentitas"
            class="w-full h-12 rounded-xl bg-accent-500 hover:bg-accent-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold flex items-center justify-center gap-2 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-600">
            <i data-lucide="loader-2" class="w-5 h-5 animate-spin" x-show="loadingIdentitas"></i>
            <span x-text="terkunciIdentitas ? 'Coba lagi nanti' : 'Lanjut'"></span>
          </button>
        </div>
      </template>

      <template x-if="identitasTerverifikasi">
        <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-accent-500/15 flex items-center justify-center shrink-0"><i data-lucide="check-circle-2" class="w-7 h-7 text-accent-600"></i></div>
            <div><p class="font-semibold text-slate-900">Berhasil! Ini kartumu ya:</p><p class="text-sm text-slate-600">Pastikan datanya benar sebelum lanjut.</p></div>
          </div>
          <div class="rounded-xl border border-white/50 bg-white/70 p-4 space-y-2">
            <div class="flex justify-between text-sm"><span class="text-slate-500">Nama</span><span class="font-semibold text-slate-800" x-text="peserta.nama"></span></div>
            <div class="flex justify-between text-sm"><span class="text-slate-500">Kelas</span><span class="font-semibold text-slate-800" x-text="peserta.kelas"></span></div>
            <div class="flex justify-between text-sm"><span class="text-slate-500">Nomor Peserta</span><span class="font-semibold text-slate-800" x-text="peserta.nomor"></span></div>
            <div class="h-px bg-slate-200 my-1"></div>
            <template x-if="sesiAktif">
              <div>
                <div class="flex justify-between text-sm"><span class="text-slate-500">Ujian</span><span class="font-semibold text-accent-600" x-text="sesiAktif.nama"></span></div>
                <div class="flex justify-between text-sm"><span class="text-slate-500">Durasi</span><span class="font-semibold text-slate-800" x-text="sesiAktif.durasi + ' menit'"></span></div>
              </div>
            </template>
            <template x-if="!sesiAktif">
              <p class="text-sm text-amber-600">Belum ada ujian yang sedang berlangsung untuk kelasmu saat ini.</p>
            </template>
          </div>
        </div>
      </template>

      <template x-if="step === 2">
        <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 space-y-4">
          <div>
            <h2 class="text-lg font-semibold text-slate-900">Masukkan Token Sesi</h2>
            <p class="text-sm text-slate-600">Minta Token dari Bapak/Ibu Guru pengawas ya.</p>
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-slate-700">Token Sesi</label>
            <input type="text" inputmode="numeric" x-model="form.token" @keydown.enter="verifikasiToken()" placeholder="Contoh: 482913"
              class="w-full h-14 rounded-xl border border-slate-200 bg-white/80 px-4 text-2xl text-center tracking-[0.3em] font-bold text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500 focus:border-accent-500 transition">
          </div>
          <template x-if="errorToken">
            <div class="flex items-start gap-2 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700"><i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i><span x-text="errorToken"></span></div>
          </template>
          <div class="flex gap-3">
            <button @click="step = 1" type="button" class="h-12 px-4 rounded-xl border border-slate-200 bg-white/70 text-slate-600 font-medium hover:bg-white transition flex items-center gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</button>
            <button @click="verifikasiToken()" :disabled="loadingToken || terkunciToken || !sesiAktif"
              class="flex-1 h-12 rounded-xl bg-accent-500 hover:bg-accent-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold flex items-center justify-center gap-2 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-600">
              <i data-lucide="loader-2" class="w-5 h-5 animate-spin" x-show="loadingToken"></i>
              <span x-text="terkunciToken ? 'Coba lagi nanti' : 'Mulai Ujian'"></span>
            </button>
          </div>
        </div>
      </template>

      <p class="text-center text-xs text-slate-400 pt-2">Butuh bantuan? Hubungi pengawas ruang ujian.</p>
    </div>
  </div>

<script>
function loginPeserta(){
  return {
    step: 1,
    identitasTerverifikasi: false,
    loadingIdentitas: false,
    loadingToken: false,
    errorIdentitas: '',
    errorToken: '',
    errorFatal: '',
    percobaanIdentitas: 0,
    percobaanToken: 0,
    batasIdentitas: 5,
    batasToken: 5,
    terkunciIdentitas: false,
    terkunciToken: false,
    form: { identitas: '', pin: '', token: '' },
    peserta: null,
    sesiAktif: null,

    async init(){
      lucide.createIcons();
      try{
        const p = await DB.getPengaturanPublik();
        this.batasIdentitas = p.batasIdentitas;
        this.batasToken = p.batasToken;
      }catch(e){ this.errorFatal = 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.'; }
    },

    async verifikasiIdentitas(){
      this.errorIdentitas = ''; this.errorFatal = '';
      if(!this.form.identitas || !this.form.pin){ this.errorIdentitas = 'Nama/Nomor Peserta dan Password harus diisi ya.'; return; }
      this.loadingIdentitas = true;
      try{
        const p = await DB.verifikasiIdentitas(this.form.identitas, this.form.pin);
        if(p){
          this.peserta = p;
          this.sesiAktif = await DB.sesiAktifUntukPeserta(p.id);
          this.identitasTerverifikasi = true;
          this.$nextTick(()=>lucide.createIcons());
          setTimeout(() => { this.step = 2; }, 900);
        } else {
          this.percobaanIdentitas++;
          this.errorIdentitas = 'Nama/Nomor Peserta atau Password salah, coba lagi ya';
          if(this.percobaanIdentitas >= this.batasIdentitas){ this.terkunciIdentitas = true; this.errorIdentitas = 'Terlalu banyak percobaan. Tunggu sebentar ya, atau minta bantuan pengawas.'; }
        }
      }catch(e){
        this.errorFatal = 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.';
      } finally {
        this.loadingIdentitas = false;
      }
    },

    async verifikasiToken(){
      this.errorToken = ''; this.errorFatal = '';
      if(!this.sesiAktif){ this.errorToken = 'Belum ada ujian yang berlangsung untuk kelasmu.'; return; }
      if(!this.form.token){ this.errorToken = 'Token Sesi harus diisi ya.'; return; }
      this.loadingToken = true;
      try{
        const ok = await DB.verifikasiToken(this.sesiAktif.id, this.form.token);
        if(ok){
          const hasil = await DB.getOrCreateHasil(this.peserta.id, this.sesiAktif.id);
          DB.setSession({ pesertaId: this.peserta.id, sesiId: this.sesiAktif.id, hasilId: hasil.id });
          window.location.href = 'konfirmasi-tata-tertib.html';
          return;
        } else {
          this.percobaanToken++; this.form.token = '';
          this.errorToken = 'Token sudah berganti, minta token terbaru ke pengawas';
          if(this.percobaanToken >= this.batasToken){ this.terkunciToken = true; this.errorToken = 'Terlalu banyak percobaan. Tunggu sebentar ya, atau minta bantuan pengawas.'; }
        }
      }catch(e){
        this.errorFatal = 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.';
      } finally {
        this.loadingToken = false;
      }
    }
  }
}
</script>
</body>
</html>
