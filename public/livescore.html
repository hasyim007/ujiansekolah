<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livescore Ujian — Sistem Ujian Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Plus Jakarta Sans','ui-sans-serif','system-ui'] },
    colors: { accent: { 300:'#5fe0c5', 500:'#0ea5a4', 600:'#0c8584' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api.js"></script>
<script src="//unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .glass{ background:rgba(255,255,255,.7); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.5); }
  @keyframes pulseHighlight { 0%{ box-shadow:0 0 0 0 rgba(14,165,164,.5);} 100%{ box-shadow:0 0 0 12px rgba(14,165,164,0);} }
  .highlight{ animation: pulseHighlight 900ms ease-out; }
</style>
</head>
<body class="min-h-screen bg-slate-50" x-data="livescore()" x-init="init()">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-40 -left-32 w-[34rem] h-[34rem] bg-accent-300/25 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-32 w-[34rem] h-[34rem] bg-accent-500/15 rounded-full blur-3xl"></div>
  </div>

  <div class="relative max-w-6xl mx-auto px-4 sm:px-6 py-6 md:py-10 space-y-6">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <p class="text-xs uppercase tracking-wide text-accent-600 font-semibold">Livescore</p>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight" x-text="sesiSekarang?.nama || '—'"></h1>
      </div>
      <select x-model="sesiId" @change="muat()" class="h-11 rounded-xl border border-slate-200 bg-white/80 px-4 text-sm font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500">
        <template x-for="s in sesiList" :key="s.id"><option :value="s.id" x-text="s.nama + ' (' + s.kelas + ')'"></option></template>
      </select>
    </div>

    <template x-if="errorFatal">
      <div class="rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 flex items-center gap-2"><i data-lucide="wifi-off" class="w-4 h-4"></i><span x-text="errorFatal"></span></div>
    </template>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 text-center"><p class="text-4xl md:text-5xl font-extrabold text-slate-900" x-text="ringkasan.total"></p><p class="text-sm text-slate-500 mt-1">Total Peserta</p></div>
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 text-center"><p class="text-4xl md:text-5xl font-extrabold text-accent-600" x-text="ringkasan.selesai"></p><p class="text-sm text-slate-500 mt-1">Sudah Selesai</p></div>
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 text-center"><p class="text-4xl md:text-5xl font-extrabold text-amber-500" x-text="ringkasan.mengerjakan"></p><p class="text-sm text-slate-500 mt-1">Sedang Mengerjakan</p></div>
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 text-center"><p class="text-4xl md:text-5xl font-extrabold text-slate-400" x-text="ringkasan.belum"></p><p class="text-sm text-slate-500 mt-1">Belum Mulai</p></div>
    </div>

    <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-5">
      <div class="flex items-center justify-between mb-2"><p class="text-sm font-semibold text-slate-700">Progres Keseluruhan</p><p class="text-sm font-bold text-accent-600" x-text="persenSelesai()+'%'"></p></div>
      <div class="h-4 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-accent-500 rounded-full transition-all duration-700" :style="'width:'+persenSelesai()+'%'"></div></div>
    </div>

    <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-5">
      <p class="text-sm font-semibold text-slate-700 mb-4">Status Peserta</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        <template x-for="p in daftarPeserta" :key="p.id">
          <div class="rounded-xl border p-4 transition" :class="[p.baru ? 'highlight' : '', p.status==='Selesai' ? 'bg-accent-500/5 border-accent-500/30' : p.status==='Sedang Mengerjakan' ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200']">
            <p class="font-semibold text-slate-800 text-sm truncate" x-text="p.nama"></p>
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-xs font-medium px-2 py-0.5 rounded-full" :class="p.status==='Selesai' ? 'bg-accent-500/15 text-accent-700' : p.status==='Sedang Mengerjakan' ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-500'" x-text="p.status"></span>
              <span x-show="p.status==='Selesai' && tampilkanNilai" class="text-sm font-bold text-slate-800" x-text="p.nilai"></span>
            </div>
          </div>
        </template>
        <p x-show="daftarPeserta.length===0" class="col-span-full text-center text-sm text-slate-400 py-6">Belum ada peserta untuk sesi ini.</p>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400">Diperbarui otomatis setiap beberapa detik.</p>
  </div>

<script>
function livescore(){
  return {
    sesiId: '', sesiList: [], roster: [], hasilList: [], prevStatus: {}, daftarPeserta: [], errorFatal:'',
    async init(){
      lucide.createIcons();
      try{
        this.sesiList = await DB.getSesi();
        this.sesiId = (this.sesiList.find(s=>s.status==='Berlangsung') || this.sesiList[0] || {}).id || '';
        await this.muat();
      }catch(e){ this.errorFatal = 'Tidak bisa memuat data dari server. Periksa koneksi & konfigurasi D1.'; }
      setInterval(()=> this.muat(), 4000);
    },
    async muat(){
      if(!this.sesiId) return;
      try{
        this.roster = await DB.getPesertaRoster();
        this.hasilList = await DB.getHasil(this.sesiId);
        this.hitungDaftar();
      }catch(e){ /* biarkan data lama tampil, coba lagi di polling berikutnya */ }
    },
    get sesiSekarang(){ return this.sesiList.find(s=>s.id===this.sesiId); },
    get tampilkanNilai(){ return !!this.sesiSekarang?.tampilkanNilai; },
    get ringkasan(){
      const list = this.daftarPeserta;
      const selesai = list.filter(p=>p.status==='Selesai').length;
      const mengerjakan = list.filter(p=>p.status==='Sedang Mengerjakan').length;
      return { total:list.length, selesai, mengerjakan, belum: list.length-selesai-mengerjakan };
    },
    persenSelesai(){ const r=this.ringkasan; return r.total ? Math.round((r.selesai/r.total)*100) : 0; },
    hitungDaftar(){
      const sesi = this.sesiSekarang; if(!sesi){ this.daftarPeserta = []; return; }
      const order = { 'Selesai':0, 'Sedang Mengerjakan':1, 'Belum Mulai':2 };
      const list = this.roster.filter(p=>sesi.kelas.includes(p.kelas)).map(p=>{
        const h = this.hasilList.find(x=>x.pesertaId===p.id);
        const status = h ? h.status : 'Belum Mulai';
        const baru = this.prevStatus[p.id] && this.prevStatus[p.id] !== status;
        this.prevStatus[p.id] = status;
        return { id:p.id, nama:p.nama, status, nilai: h?h.nilai:null, baru };
      });
      this.daftarPeserta = list.sort((a,b)=> order[a.status]-order[b.status]);
    }
  }
}
</script>
</body>
</html>
