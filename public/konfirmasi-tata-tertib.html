<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tata Tertib Ujian — Sistem Ujian Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Plus Jakarta Sans','ui-sans-serif','system-ui'] },
    colors: { accent: { 300:'#5fe0c5', 500:'#0ea5a4', 600:'#0c8584' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api.js"></script>
<script src="//unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .glass{ background:rgba(255,255,255,.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.4); }
</style>
</head>
<body class="min-h-screen bg-slate-50">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 w-96 h-96 bg-accent-300/25 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-24 w-96 h-96 bg-accent-500/15 rounded-full blur-3xl"></div>
  </div>

  <header class="sticky top-0 z-20 glass shadow-lg shadow-slate-900/5">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-accent-500 flex items-center justify-center"><i data-lucide="graduation-cap" class="w-4 h-4 text-white"></i></div>
      <span class="font-semibold text-slate-800">Sistem Ujian Sekolah</span>
    </div>
  </header>

  <main x-data="tataTertib()" x-init="init()" class="relative max-w-3xl mx-auto px-4 sm:px-6 py-8 md:py-12 space-y-6">

    <template x-if="loading">
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-8 text-center"><i data-lucide="loader-2" class="w-6 h-6 text-accent-600 animate-spin mx-auto"></i></div>
    </template>

    <template x-if="!loading && (!sesi || !peserta)">
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-8 text-center space-y-3">
        <i data-lucide="alert-circle" class="w-8 h-8 text-amber-500 mx-auto"></i>
        <p class="text-slate-700">Sesi ujian tidak ditemukan. Silakan login ulang.</p>
        <a href="login-peserta.html" class="inline-block h-11 px-5 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-semibold leading-[44px]">Kembali ke Login</a>
      </div>
    </template>

    <template x-if="!loading && sesi && peserta">
      <div class="space-y-6">
        <section class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-accent-500/15 flex items-center justify-center shrink-0"><i data-lucide="user" class="w-7 h-7 text-accent-600"></i></div>
            <div class="flex-1 min-w-0">
              <p class="font-bold text-slate-900 text-lg" x-text="peserta.nama"></p>
              <p class="text-sm text-slate-600">Kelas <span x-text="peserta.kelas"></span> · No. Peserta <span x-text="peserta.nomor"></span></p>
            </div>
            <div class="hidden sm:block text-right"><p class="text-xs text-slate-400">Ujian</p><p class="font-semibold text-accent-600" x-text="sesi.nama"></p></div>
          </div>
        </section>

        <section class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 space-y-4">
          <div class="flex items-center gap-2"><i data-lucide="clipboard-list" class="w-5 h-5 text-accent-600"></i><h2 class="text-lg font-bold text-slate-900">Tata Tertib Ujian</h2></div>
          <ul class="space-y-3">
            <template x-for="(item, idx) in tataTertibList" :key="idx">
              <li class="flex gap-3 text-slate-700 leading-relaxed">
                <span class="w-6 h-6 rounded-full bg-accent-500/10 text-accent-600 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5" x-text="idx+1"></span>
                <span x-text="item"></span>
              </li>
            </template>
          </ul>
        </section>

        <section class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-6 space-y-4">
          <label class="flex items-start gap-3 cursor-pointer select-none">
            <input type="checkbox" x-model="setuju" class="mt-1 w-5 h-5 rounded border-slate-300 text-accent-500 focus-visible:ring-2 focus-visible:ring-accent-500">
            <span class="text-sm text-slate-700 leading-relaxed">Saya telah membaca dan menyetujui tata tertib ujian di atas, dan siap mengerjakan dengan jujur.</span>
          </label>
          <button @click="mulai()" :disabled="!setuju"
            class="w-full h-14 rounded-xl bg-accent-500 hover:bg-accent-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-base font-bold flex items-center justify-center gap-2 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-600">
            <i data-lucide="play-circle" class="w-5 h-5"></i> Mulai Mengerjakan
          </button>
        </section>
      </div>
    </template>
  </main>

<script>
function tataTertib(){
  return {
    loading: true,
    peserta: null, sesi: null,
    tataTertibList: [
      'Pastikan kamu duduk di ruang ujian yang sudah ditentukan sebelum memulai.',
      'Kerjakan soal sendiri, jangan bekerja sama dengan teman.',
      'Jawaban akan tersimpan otomatis setiap kamu pindah soal, jadi tidak perlu takut lupa menyimpan.',
      'Kalau internet terputus, tetap tenang — jawaban tetap aman dan akan tersinkron begitu internet kembali.',
      'Jangan tinggalkan halaman ujian (jangan tekan tombol back atau tutup tab) sebelum menekan tombol "Selesai Ujian".',
      'Kalau ada kendala, gunakan tombol "Lapor Kendala" atau panggil pengawas ruang ujian.',
      'Waktu ujian akan otomatis berhenti dan jawaban akan tersubmit sendiri kalau waktu habis.'
    ],
    setuju: false,
    async init(){
      lucide.createIcons();
      const sess = DB.getSession();
      if(sess){
        try{
          this.peserta = await DB.getPesertaById(sess.pesertaId);
          this.sesi = await DB.getSesiById(sess.sesiId);
        }catch(e){ /* dibiarkan null -> tampil pesan error */ }
      }
      this.loading = false;
      this.$nextTick(()=>lucide.createIcons());
    },
    mulai(){
      if(!this.setuju) return;
      window.location.href = 'pengerjaan-ujian.html';
    }
  }
}
</script>
</body>
</html>
