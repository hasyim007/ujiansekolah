<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Ujian Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Plus Jakarta Sans','ui-sans-serif','system-ui'] },
    colors: { accent: { 300:'#5fe0c5', 500:'#0ea5a4', 600:'#0c8584' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .glass{ background:rgba(255,255,255,.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.4); }
  .card-hover{ transition: transform .15s ease, box-shadow .15s ease; }
  .card-hover:hover{ transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(15,23,42,.12); }
</style>
</head>
<body class="min-h-screen bg-slate-50 relative overflow-x-hidden">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 w-96 h-96 bg-accent-300/30 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-24 w-96 h-96 bg-accent-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative min-h-screen flex flex-col items-center justify-center px-4 py-10">

    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 w-14 h-14 rounded-2xl bg-accent-500 flex items-center justify-center shadow-lg shadow-accent-500/30">
        <i data-lucide="graduation-cap" class="w-7 h-7 text-white"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Sistem Ujian Sekolah</h1>
      <p class="text-slate-600 mt-1">Pilih masuk sebagai apa</p>
    </div>

    <div class="w-full max-w-2xl grid sm:grid-cols-2 gap-4">

      <a href="/login-peserta.html" class="card-hover glass rounded-2xl p-6 flex flex-col items-start gap-3 shadow-sm">
        <div class="w-11 h-11 rounded-xl bg-accent-500/10 flex items-center justify-center">
          <i data-lucide="user-round" class="w-5 h-5 text-accent-600"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-900">Peserta</h2>
          <p class="text-sm text-slate-600 mt-1">Login pakai nomor peserta &amp; PIN untuk mulai mengerjakan ujian.</p>
        </div>
        <span class="mt-auto inline-flex items-center gap-1 text-sm font-semibold text-accent-600">
          Masuk <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </span>
      </a>

      <a href="/login-admin.html" class="card-hover glass rounded-2xl p-6 flex flex-col items-start gap-3 shadow-sm">
        <div class="w-11 h-11 rounded-xl bg-slate-900/5 flex items-center justify-center">
          <i data-lucide="shield-check" class="w-5 h-5 text-slate-700"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-900">Admin</h2>
          <p class="text-sm text-slate-600 mt-1">Kelola bank soal, sesi ujian, peserta, dan lihat hasil penilaian.</p>
        </div>
        <span class="mt-auto inline-flex items-center gap-1 text-sm font-semibold text-slate-700">
          Masuk <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </span>
      </a>

    </div>

    <a href="/livescore.html" class="mt-4 inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-accent-600 transition">
      <i data-lucide="monitor" class="w-4 h-4"></i>
      Buka layar Livescore
    </a>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
