<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Ujian Saya — Sistem Ujian Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Plus Jakarta Sans','ui-sans-serif','system-ui'] },
    colors: { accent: { 300:'#5fe0c5', 500:'#0ea5a4', 600:'#0c8584' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="api.js"></script>
<script src="//unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .glass{ background:rgba(255,255,255,.65); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.45); }
</style>
</head>
<body class="min-h-screen bg-slate-50" x-data="riwayat()" x-init="init()">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 w-96 h-96 bg-accent-300/20 rounded-full blur-3xl"></div>
  </div>

  <header class="sticky top-0 z-20 glass shadow-lg shadow-slate-900/5">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-accent-500 flex items-center justify-center"><i data-lucide="graduation-cap" class="w-4 h-4 text-white"></i></div>
        <span class="font-semibold text-slate-800" x-text="peserta ? 'Riwayat Ujian — '+peserta.nama : 'Riwayat Ujian Saya'"></span>
      </div>
      <a href="login-peserta.html" class="text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1"><i data-lucide="log-out" class="w-4 h-4"></i>Keluar</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 space-y-6">

    <template x-if="loading">
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-8 text-center"><i data-lucide="loader-2" class="w-6 h-6 text-accent-600 animate-spin mx-auto"></i></div>
    </template>

    <template x-if="!loading && !peserta">
      <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-8 text-center space-y-3">
        <i data-lucide="alert-circle" class="w-8 h-8 text-amber-500 mx-auto"></i>
        <p class="text-slate-700">Kamu belum login. Silakan login dulu untuk melihat riwayat nilaimu.</p>
        <a href="login-peserta.html" class="inline-block h-11 px-5 rounded-xl bg-accent-500 hover:bg-accent-600 text-white font-semibold leading-[44px]">Login</a>
      </div>
    </template>

    <template x-if="!loading && peserta">
      <div class="space-y-6">
        <section class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-5" x-show="daftar.length>0">
          <p class="text-sm font-semibold text-slate-700 mb-3">Perkembangan Nilai per Mapel</p>
          <canvas id="chartRiwayat" height="180"></canvas>
        </section>

        <section class="space-y-3">
          <template x-for="r in daftar" :key="r.id">
            <div class="glass rounded-2xl shadow-lg shadow-slate-900/5 p-5 flex items-center justify-between gap-4">
              <div class="min-w-0"><p class="font-semibold text-slate-800 truncate" x-text="r.nama"></p><p class="text-xs text-slate-500" x-text="r.mapel + ' · ' + r.tanggal"></p></div>
              <div class="text-right shrink-0">
                <p class="text-2xl font-extrabold" :class="r.tampil ? 'text-accent-600' : 'text-slate-300'" x-text="r.tampil ? r.nilai : '?'"></p>
              </div>
            </div>
          </template>
          <p x-show="daftar.length===0" class="text-center text-sm text-slate-400 py-8">Belum ada ujian yang selesai dikerjakan.</p>
        </section>
      </div>
    </template>
  </main>

<script>
function riwayat(){
  return {
    loading: true,
    peserta: null, daftar: [],
    async init(){
      lucide.createIcons();
      const sess = DB.getSession();
      if(!sess){ this.loading = false; return; }
      try{
        this.peserta = await DB.getPesertaById(sess.pesertaId);
        if(!this.peserta){ this.loading = false; return; }
        const hasilSaya = (await DB.getHasilForPeserta(this.peserta.id)).filter(h=>h.status==='Selesai');
        const sesiList = await DB.getSesi();
        this.daftar = hasilSaya.map(h => {
          const s = sesiList.find(x=>x.id===h.sesiId);
          return { id:h.id, nama: s?s.nama:'-', mapel: s?s.mapel:'-', tanggal: new Date(h.waktuSelesai).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}), nilai:h.nilai, tampil: !!(s && s.tampilkanNilai), ts:h.waktuSelesai };
        }).sort((a,b)=>a.ts-b.ts);
      }catch(e){ /* biarkan daftar kosong */ }
      this.loading = false;
      this.$nextTick(()=>{ lucide.createIcons(); this.renderChart(); });
    },
    renderChart(){
      const canvas = document.getElementById('chartRiwayat');
      if(!canvas || this.daftar.length===0) return;
      const mapelSet = [...new Set(this.daftar.map(d=>d.mapel))];
      const labels = this.daftar.map(d=>d.tanggal);
      const palet = ['#0ea5a4','#5fe0c5','#0c8584','#94d8ca'];
      const datasets = mapelSet.map((m,i)=>({
        label:m, borderColor:palet[i%palet.length], backgroundColor:palet[i%palet.length], tension:.3,
        data: this.daftar.map(d=> d.mapel===m && d.tampil ? d.nilai : null)
      }));
      new Chart(canvas, { type:'line', data:{ labels, datasets }, options:{ plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ family:'Plus Jakarta Sans', size:11 } } } }, scales:{ y:{ beginAtZero:true, max:100 } } } });
    }
  }
}
</script>
</body>
</html>
