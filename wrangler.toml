name = "sistem-ujian-sekolah"
main = "src/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
# /admin-*.html dan /api/* WAJIB lewat Worker dulu (cek sesi admin / jalankan route API)
# sebelum file statis dikirim. Path lain (login-peserta.html, livescore.html, api.js, dst)
# langsung dilayani dari assets tanpa invoke Worker.
run_worker_first = ["/admin-*", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ujian_sekolah_db"
database_id = "GANTI_DENGAN_ID_D1_KAMU"
